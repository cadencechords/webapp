# Netlify preview deploys for pull requests, opt-in with the `preview` label.
#
# Production deploys are not handled here: they stay with Netlify's own Git
# integration, and this workflow only ever creates and deletes alias deploys.
#
# Trigger logic (deploy job):
# - `labeled`: deploy only when the label just added is `preview`. Adding any
#   other label to a PR never deploys, even if the PR already has `preview`.
# - `synchronize` (new commits pushed) and `reopened`: redeploy only when the
#   PR already has the `preview` label.
# - Everything else is skipped, so PRs without the label never deploy.
# - Closed PRs never deploy, even if `preview` is added to one.
#
# Cleanup logic (cleanup job): previews use the production backends, so they
# aren't left running. The preview's deploys are deleted when
# - the PR is closed (merged or not) while it has the `preview` label, or
# - the `preview` label is removed.
# Reopening a labeled PR, or adding the label again, deploys it again.
#
# Every deploy of a PR uses the alias `pr-<number>`, so the preview URL
# (https://pr-<number>--<site>.netlify.app) stays the same across pushes.
#
# Fork PRs: `pull_request` runs from forks get no repository secrets and a
# read-only GITHUB_TOKEN, so they can neither deploy nor comment. Both jobs skip
# them. This workflow assumes PRs come from branches in this repository. Don't
# switch it to `pull_request_target` to get around that: that would run a
# fork's code with this repository's secrets.

name: Netlify preview

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

# Both jobs share one concurrency group per PR (see each job), at job level
# rather than workflow level so a skipped run (e.g. another label being added)
# never cancels a real one. A newer run cancels an older in-progress one: a new
# push cancels a stale build, and closing the PR or removing the label cancels
# a build before deleting the preview. A cancelled run leaves the comment alone
# (its success/failure steps don't run on cancellation), so the comment tracks
# the newest run.

jobs:
  deploy:
    name: Deploy preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
        (
          (github.event.action == 'synchronize' || github.event.action == 'reopened') &&
          contains(github.event.pull_request.labels.*.name, 'preview')
        )
      )
    runs-on: ubuntu-latest
    concurrency:
      group: netlify-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CYPRESS_INSTALL_BINARY: 0 # the Cypress binary isn't needed to build
    steps:
      # Sticky comment: the PR gets exactly one preview comment, found by the
      # hidden marker in its body. Each state below edits that comment in
      # place; it's only created if no comment has the marker yet (except
      # `removed`, which only edits one). The script is defined once here
      # (&update-comment) and reused by the later steps and the cleanup job.
      - name: 'Comment: deploying'
        uses: actions/github-script@v7
        env:
          STATE: deploying
        with:
          script: &update-comment |
            const marker = '<!-- netlify-preview-comment -->';
            const { STATE, HEAD_SHA, PREVIEW_URL, REASON } = process.env;
            const commit = `Commit: \`${HEAD_SHA.slice(0, 7)}\``;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const logs = `View GitHub Actions logs: ${runUrl}`;
            const lines = {
              deploying: ['🟡 Deploying…', commit],
              success: ['✅ Preview ready', `Preview: ${PREVIEW_URL}`, commit],
              failure: ['❌ Deployment failed', commit, logs],
              removed: ['🧹 Preview removed', REASON],
              'cleanup-failed': ["⚠️ Couldn't remove the preview", REASON, logs],
            }[STATE];
            const body = [marker, '### Netlify Preview', '', ...lines.map((line) => `${line}  `)].join('\n');

            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else if (STATE !== 'removed') {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

      - uses: actions/checkout@v4
        with:
          # The PR's head commit, not the merge commit `pull_request` checks out by default.
          ref: ${{ env.HEAD_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # `netlify build` runs the site's build command with the deploy-preview
      # context's environment variables (from netlify.toml and the Netlify UI).
      # Deploying is a separate step (`--no-build`) that uploads that output.
      # The CLI only accepts --context on deploy when it also builds, so the
      # deploy-preview context is applied here, where the env vars are read.
      # The Netlify secrets are only given to the steps that need them, not
      # to `yarn install` (dependency install scripts) or the comment steps.
      - name: Build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@27 build --context deploy-preview

      - name: Deploy
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@27 deploy \
            --no-build \
            --dir build \
            --alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} @ ${HEAD_SHA}" \
            --json > "$RUNNER_TEMP/deploy.json"
          jq . "$RUNNER_TEMP/deploy.json"
          # The JSON's deploy_url can be the unique per-deploy URL, so build the
          # stable alias URL from the site name instead.
          url=$(jq -er '"https://pr-\(env.PR_NUMBER)--\(.site_name // error("no site_name")).netlify.app"' "$RUNNER_TEMP/deploy.json")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 'Comment: ready'
        if: success()
        uses: actions/github-script@v7
        env:
          STATE: success
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: *update-comment

      - name: 'Comment: failed'
        if: failure()
        uses: actions/github-script@v7
        env:
          STATE: failure
        with:
          script: *update-comment

  cleanup:
    name: Remove preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview')) ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'preview')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: netlify-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      ALIAS: pr-${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REASON: ${{ github.event.action == 'closed' && 'The PR was closed.' || 'The `preview` label was removed.' }}
    steps:
      # Every push creates a new deploy on the alias, and each old one stays
      # reachable at its own unique URL, so all of the alias's deploys are
      # deleted, not just the one it currently serves. The deploys are listed
      # through the Netlify API and matched on `branch`, where the CLI stores
      # the alias. The `branch` query parameter is only a hint that narrows the
      # list: the jq filter is what decides, so nothing else is ever deleted.
      - name: Delete the alias's deploys
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          api="https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys"
          auth="Authorization: Bearer ${NETLIFY_AUTH_TOKEN}"
          : > "$RUNNER_TEMP/ids"
          page=1
          while :; do
            curl -sS --fail-with-body -H "$auth" \
              "${api}?branch=${ALIAS}&per_page=100&page=${page}" > "$RUNNER_TEMP/page.json"
            jq -r --arg alias "$ALIAS" \
              '.[] | select(.branch == $alias and .context != "production") | .id' \
              "$RUNNER_TEMP/page.json" >> "$RUNNER_TEMP/ids"
            [ "$(jq length "$RUNNER_TEMP/page.json")" -lt 100 ] && break
            page=$((page + 1))
          done
          echo "Deleting $(wc -l < "$RUNNER_TEMP/ids") deploys for ${ALIAS}"
          while read -r id; do
            curl -sS --fail-with-body -X DELETE -H "$auth" "${api}/${id}"
            echo "Deleted ${id}"
          done < "$RUNNER_TEMP/ids"

      - name: 'Comment: removed'
        if: success()
        uses: actions/github-script@v7
        env:
          STATE: removed
        with:
          script: *update-comment

      - name: 'Comment: cleanup failed'
        if: failure()
        uses: actions/github-script@v7
        env:
          STATE: cleanup-failed
        with:
          script: *update-comment
